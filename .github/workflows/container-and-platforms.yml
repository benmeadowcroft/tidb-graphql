name: Container and Platforms

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: container-and-platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      k8s_changed: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            k8s:
              - 'examples/k8s/quickstart/manifests/**'
              - '.github/workflows/container-and-platforms.yml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      # These checks run in the `test` job, not in jobs of their own, so the
      # existing required check covers them and auto-merge waits for them.

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Unit tests only cover ./internal/..., so also compile cmd/ and the
      # integration tests (behind the `integration` build tag).
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.15.0

      # Same as `just test-unit`, plus the race detector.
      - name: Run unit tests
        run: go test -short -race -v ./internal/...

  compose-compat:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configs
        run: |
          docker compose config >/dev/null
          docker compose -f examples/compose/quickstart/docker-compose.yml config >/dev/null
          docker compose -f examples/compose/remote-db/docker-compose.yml config >/dev/null
          docker compose -f examples/compose/quickstart-db-zero/docker-compose.yml config >/dev/null
          docker compose -f examples/compose/oidc-roles/docker-compose.yml config >/dev/null

  k8s-compat:
    needs: [changes, test]
    if: needs.changes.outputs.k8s_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: latest

      - name: Render Kubernetes kustomization
        run: kubectl kustomize examples/k8s/quickstart/manifests >/dev/null

  # Runs tests/integration against a throwaway TiDB in a service container, so
  # changes (including auto-merged dependency updates) are checked against a
  # real database, not just unit tests. Runs alongside `test`, not after it.
  #
  # A single standalone TiDB has no TiKV/PD, so the @asOf (snapshot read) tests
  # skip themselves here. Run them against TiDB Cloud with `just test-integration`.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      tidb:
        image: pingcap/tidb:v8.5.5
        ports:
          - 4000:4000
    env:
      TIDB_HOST: 127.0.0.1
      TIDB_PORT: "4000"
      TIDB_USER: root
      # Not a secret: it only protects the service container above, which is
      # discarded when the job ends. The test helpers skip without a password.
      TIDB_PASSWORD: ci-integration
      TIDB_TLS_MODE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      # The TiDB image has no client to use for a service health check, so wait
      # here with the runner's mysql client, then give root a password.
      - name: Wait for TiDB and set the root password
        run: |
          for _ in $(seq 1 60); do
            if mysql -h "$TIDB_HOST" -P "$TIDB_PORT" -u root -e "SELECT 1" >/dev/null 2>&1; then
              mysql -h "$TIDB_HOST" -P "$TIDB_PORT" -u root \
                -e "ALTER USER 'root'@'%' IDENTIFIED BY '$TIDB_PASSWORD'"
              exit 0
            fi
            sleep 2
          done
          echo "::error::TiDB did not become ready in time"
          exit 1

      # `shell: bash` adds pipefail, so a test failure isn't hidden by tee.
      - name: Run integration tests
        shell: bash
        run: go test -v -count=1 -tags=integration ./tests/integration/... 2>&1 | tee integration.log

      # `go test` also passes when every test skips (e.g. if the connection
      # settings above were wrong), so check the tests really ran. Only the
      # @asOf tests are expected to skip against a standalone TiDB.
      - name: Check tests ran
        run: |
          passed=$(grep -c '^--- PASS' integration.log || true)
          skipped=$(grep -c '^--- SKIP' integration.log || true)
          unexpected=$(grep '^--- SKIP' integration.log | grep -v '^--- SKIP: TestAsOf' || true)
          {
            echo "### Integration tests"
            echo "Passed: $passed, skipped: $skipped (the @asOf tests need TiKV/PD)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$passed" -eq 0 ]]; then
            echo "::error::No integration tests passed; check the TiDB connection settings."
            exit 1
          fi
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected skipped tests:"
            echo "$unexpected"
            exit 1
          fi

  build-and-push:
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      needs.test.result == 'success' &&
      needs.integration.result == 'success' &&
      needs['compose-compat'].result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs['k8s-compat'].result)
    needs: [changes, test, integration, compose-compat, k8s-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Determine Go toolchain version
        id: go
        shell: bash
        run: |
          echo "go_version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Prepare build args
        id: build-args
        run: |
          echo "version=$(cat VERSION 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.go.outputs.go_version }}
            VERSION=${{ steps.build-args.outputs.version }}
            COMMIT=${{ steps.build-args.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest platforms
        run: |
          digest="${{ steps.build.outputs.digest }}"
          image="ghcr.io/${{ github.repository }}@${digest}"
          docker buildx imagetools inspect "$image" | tee /tmp/imagetools.txt
          grep -q "linux/amd64" /tmp/imagetools.txt
          grep -q "linux/arm64" /tmp/imagetools.txt
