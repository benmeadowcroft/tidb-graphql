version: 2
updates:
  # Go modules. "fix" makes release-please cut a patch release so dependency
  # (and security) updates reach published images.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
    groups:
      # OpenTelemetry modules must move together to stay compatible.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
          - "github.com/XSAM/otelsql"
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
