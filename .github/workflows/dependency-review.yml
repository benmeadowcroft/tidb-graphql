name: Dependency review

# Blocks PRs that introduce vulnerable dependencies. Unlike a full vulnerability
# scan, it only looks at what the PR changes, so newly published advisories
# against existing dependencies don't block unrelated PRs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
