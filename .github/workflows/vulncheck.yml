name: govulncheck

# Reports findings to GitHub code scanning (Security -> Code scanning) rather
# than failing the build. Alerts close automatically once fixed, and PRs show
# only the alerts they introduce. Pushes to main keep the baseline current.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "33 3 * * MON,THU" # Monday & Thursday at 03:33 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ''
          output-format: sarif
          output-file: govulncheck.sarif

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
