name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow Conventional Commits: \"$TITLE\""
            echo "Expected format: <type>[(scope)][!]: <description>"
            echo "Example: feat: add vector search support"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "PR title OK: $TITLE"
