name: Integration tests

# Runs tests/integration against a throwaway TiDB in a service container, so
# changes (including auto-merged dependency updates) are checked against a real
# database, not just unit tests.
#
# A single standalone TiDB has no TiKV/PD, so the @asOf (snapshot read) tests
# skip themselves here. Run them against TiDB Cloud with `just test-integration`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      tidb:
        image: pingcap/tidb:v8.5.5
        ports:
          - 4000:4000
    env:
      TIDB_HOST: 127.0.0.1
      TIDB_PORT: "4000"
      TIDB_USER: root
      # Not a secret: it only protects the service container above, which is
      # discarded when the job ends. The test helpers skip without a password.
      TIDB_PASSWORD: ci-integration
      TIDB_TLS_MODE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # The TiDB image has no client to use for a service health check, so wait
      # here with the runner's mysql client, then give root a password.
      - name: Wait for TiDB and set the root password
        run: |
          for _ in $(seq 1 60); do
            if mysql -h "$TIDB_HOST" -P "$TIDB_PORT" -u root -e "SELECT 1" >/dev/null 2>&1; then
              mysql -h "$TIDB_HOST" -P "$TIDB_PORT" -u root \
                -e "ALTER USER 'root'@'%' IDENTIFIED BY '$TIDB_PASSWORD'"
              exit 0
            fi
            sleep 2
          done
          echo "::error::TiDB did not become ready in time"
          exit 1

      - name: Run integration tests
        run: go test -v -count=1 -tags=integration ./tests/integration/...
